name: 构建ZexNote Release ARM64，自动签名，发布GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目源码
        uses: actions/checkout@v7

      - name: 设置JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: 静态检查与单元测试
        run: gradle -p android --no-daemon lintDebug testDebug

      - name: 编译Release APK（仅arm64）
        run: gradle -p android --no-daemon clean assembleRelease

      - name: 准备系统环境工具（安装apksigner）
        run: sudo apt-get update && sudo apt-get install -y apksigner

      - name: 还原keystore文件
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zexnote-key.jks

      - name: 对APK进行签名
        run: |
          apksigner sign \
            --ks zexnote-key.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            android/app/build/outputs/apk/release/app-release.apk

      - name: 校验APK签名
        run: apksigner verify android/app/build/outputs/apk/release/app-release.apk

      - name: 列出编译产物
        run: ls -lh android/app/build/outputs/apk/release/

      - name: 读取版本号
        id: get_version
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 配置SSH签名环境
        env:
          SSH_SIGNING_PRIVATE_KEY: ${{ secrets.SSH_SIGNING_PRIVATE_KEY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test -n "$SSH_SIGNING_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_SIGNING_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/.ssh/id_ed25519"
          git config --global user.name "$GITHUB_REPOSITORY_OWNER"
          git config --global user.email "$GITHUB_REPOSITORY_OWNER@users.noreply.github.com"

      - name: 创建带SSH签名tag并推送到远程仓库
        run: |
          set -euo pipefail
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          git fetch --tags origin
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          git tag -s "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: 发布Release，标记Latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger MirrorChyanUploading
        shell: bash
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f tag=v${{ steps.get_version.outputs.VERSION }}
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f tag=v${{ steps.get_version.outputs.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
