name: 构建ZexNote Release ARM64，自动签名，发布GitHub Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目源码
        uses: actions/checkout@v4

      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: 打印Flutter版本
        run: flutter --version

      - name: Dart语法检查
        run: flutter analyze

      - name: 获取项目依赖
        run: flutter pub get

      # 读取pubspec版本号
      - name: 读取版本号
        id: get_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # 仅编译arm64-v8a
      - name: 编译Release APK（仅arm64）
        run: flutter build apk --release --target-platform android-arm64

      # ========== 自动签名部分 ==========
      - name: 还原keystore文件
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zexnote-key.jks
      - name: 对arm64-v8a APK签名
        run: |
          apksigner sign --ks zexnote-key.jks --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.KEY_PASSWORD }} --alias ${{ secrets.KEY_ALIAS }} build/app/outputs/apk/release/app-arm64-v8a-release.apk
      
      # 校验签名是否成功
      - name: 校验APK签名
        run: |
          apksigner verify build/app/outputs/apk/release/app-arm64-v8a-release.apk

      - name: 列出编译产物
        run: ls -lh build/app/outputs/apk/release/

      - name: 发布Release，标记Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            build/app/outputs/apk/release/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
