name: 构建ZexNote Release ARM64，自动签名，发布GitHub Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目源码
        uses: actions/checkout@v4

      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: 打印Flutter版本
        run: flutter --version

      - name: 锁定dynamic_color兼容版本（避免1.9.0 Gradle kts报错）
        run: |
          # 把pubspec里的dynamic_color降级到兼容的1.7.0版本
          sed -i 's/dynamic_color: .*/dynamic_color: ^1.7.0/' pubspec.yaml
          cat pubspec.yaml | grep dynamic_color

      - name: 获取项目依赖
        run: flutter pub get

      # ========== 核心修复：自动生成标准V2 Android工程 ==========
      - name: 自动生成完整Android V2工程
        run: |
          # 用flutter create自动生成标准安卓工程，强制V2 Embedding
          flutter create --platforms=android --project-name zexnote --org com.zex .
          echo "✅ 已自动生成标准V2 Android工程"

      - name: 生成完整Gradle配置（AGP8.3 + Gradle8.3，彻底解决依赖找不到）
        run: |
          # 根目录build.gradle
          cat > android/build.gradle << 'ROOT_GRADLE_EOF'
          buildscript {
              ext.kotlin_version = '1.9.24'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.3.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          ROOT_GRADLE_EOF

          # settings.gradle
          cat > android/settings.gradle << 'SETTINGS_GRADLE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          include ':app'
          SETTINGS_GRADLE_EOF

          # app/build.gradle
          cat > android/app/build.gradle << 'APP_GRADLE_EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }
          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }
          android {
              namespace "com.zex.note"
              compileSdk 36
              defaultConfig {
                  applicationId "com.zex.note"
                  minSdk 26
                  targetSdk 36
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          flutter {
              source '../..'
          }
          APP_GRADLE_EOF

          # 指定Gradle wrapper版本8.3
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'WRAPPER_EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
          WRAPPER_EOF

          echo "✅ 已生成完整Gradle配置：AGP 8.3 + Gradle 8.3"

      - name: 自动添加权限到AndroidManifest.xml
        run: |
          # 在manifest标签里自动添加需要的权限
          sed -i 's|<application>|<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n<application>|g' android/app/src/main/AndroidManifest.xml
          echo "✅ 已自动添加所需权限"

      - name: 删除自动生成的模板测试文件（自带错误）
        run: rm -f test/widget_test.dart

      - name: Dart语法检查
        run: flutter analyze

      # 读取pubspec版本号
      - name: 读取版本号
        id: get_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # 仅编译arm64-v8a
      - name: 编译Release APK（仅arm64）
        run: flutter build apk --release --target-platform android-arm64

      # ========== 自动签名部分 ==========
      - name: 还原keystore文件
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zexnote-key.jks
      - name: 对arm64-v8a APK签名
        run: |
          apksigner sign --ks zexnote-key.jks --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.KEY_PASSWORD }} --alias ${{ secrets.KEY_ALIAS }} build/app/outputs/apk/release/app-arm64-v8a-release.apk
      
      # 校验签名是否成功
      - name: 校验APK签名
        run: |
          apksigner verify build/app/outputs/apk/release/app-arm64-v8a-release.apk

      - name: 列出编译产物
        run: ls -lh build/app/outputs/apk/release/

      - name: 发布Release，标记Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            build/app/outputs/apk/release/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
