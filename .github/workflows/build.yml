name: 构建ZexNote Release ARM64，自动签名，发布GitHub Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目源码
        uses: actions/checkout@v4

      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: 打印Flutter版本
        run: flutter --version

      - name: 严格锁定dynamic_color版本
        run: |
          sed -i 's/dynamic_color: .*/dynamic_color: 1.6.8/' pubspec.yaml
          cat pubspec.yaml | grep dynamic_color

      - name: 获取项目依赖
        run: flutter pub get

      - name: 自动生成完整Android V2工程
        run: |
          flutter create --platforms=android --project-name zexnote --org com.zex .
          echo "✅ 已自动生成标准V2 Android工程"

      - name: 生成Flutter官方标准Gradle配置
        run: |
          cat > android/settings.gradle << 'SETTINGS_GRADLE_EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.4.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.24" apply false
          }
          include ":app"
          SETTINGS_GRADLE_EOF

          cat > android/build.gradle << 'ROOT_GRADLE_EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          ROOT_GRADLE_EOF

          cat > android/app/build.gradle << 'APP_GRADLE_EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
          def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
          android {
              namespace "com.zex.note"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zex.note"
                  minSdk 26
                  targetSdk 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          flutter {
              source '../..'
          }
          APP_GRADLE_EOF

          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'WRAPPER_EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          WRAPPER_EOF
          echo "✅ 已生成Flutter官方标准Gradle配置"

      - name: 自动添加权限到AndroidManifest.xml
        run: |
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.INTERNET" />\n\
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n\
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n\
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n\
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n\
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml
          echo "✅ 已自动添加所需权限"

      - name: 删除自动生成的模板测试文件
        run: rm -f test/widget_test.dart

      - name: 修复安卓图标背景色资源缺失
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF
          echo "✅ 已补充 colors.xml"

      - name: Dart语法检查
        run: flutter analyze

      - name: 读取版本号
        id: get_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 编译Release APK（仅arm64）
        run: flutter build apk --release --target-platform android-arm64

      - name: 准备系统环境工具 (安装 apksigner)
        run: sudo apt-get update && sudo apt-get install -y apksigner

      - name: 还原keystore文件
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zexnote-key.jks

      - name: 对APK进行签名
        run: |
          apksigner sign --ks zexnote-key.jks --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.KEY_PASSWORD }} --ks-key-alias ${{ secrets.KEY_ALIAS }} build/app/outputs/flutter-apk/app-release.apk

      - name: 校验APK签名
        run: apksigner verify build/app/outputs/flutter-apk/app-release.apk

      - name: 列出编译产物
        run: ls -lh build/app/outputs/flutter-apk/

      - name: 发布Release，标记Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
