name: 构建ZexNote Release ARM64，自动签名，发布GitHub Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目源码
        uses: actions/checkout@v4

      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: 打印Flutter版本
        run: flutter --version

      - name: 获取项目依赖
        run: flutter pub get

      # ========== 自动生成正确的Android V2 Embedding文件，解决v1报错 ==========
      - name: 自动生成V2 Embedding配置
        run: |
          # 创建MainActivity.kt目录
          mkdir -p android/app/src/main/kotlin/com/zex/note
          # 写入正确的MainActivity.kt（V2嵌入）
          cat > android/app/src/main/kotlin/com/zex/note/MainActivity.kt << 'EOF'
          package com.zex.note

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          # 修正AndroidManifest.xml，确保flutterEmbedding=2
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.zex.note">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:label="ZexNote"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="flutterEmbedding"
                          android:value="2" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          echo "✅ 已自动生成V2 Embedding配置文件"

      - name: Dart语法检查
        run: flutter analyze

      # 读取pubspec版本号
      - name: 读取版本号
        id: get_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # 仅编译arm64-v8a
      - name: 编译Release APK（仅arm64）
        run: flutter build apk --release --target-platform android-arm64

      # ========== 自动签名部分 ==========
      - name: 还原keystore文件
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zexnote-key.jks
      - name: 对arm64-v8a APK签名
        run: |
          apksigner sign --ks zexnote-key.jks --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.KEY_PASSWORD }} --alias ${{ secrets.KEY_ALIAS }} build/app/outputs/apk/release/app-arm64-v8a-release.apk
      
      # 校验签名是否成功
      - name: 校验APK签名
        run: |
          apksigner verify build/app/outputs/apk/release/app-arm64-v8a-release.apk

      - name: 列出编译产物
        run: ls -lh build/app/outputs/apk/release/

      - name: 发布Release，标记Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            build/app/outputs/apk/release/app-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
